<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Trip Planner — Bento Public Share Prototype</title>
<style>
:root{
  --bg:#07110b;
  --surface:#0b1710;
  --surface-2:#0f1d14;
  --surface-3:#13231a;
  --surface-4:#172b20;
  --text:#f2f8f3;
  --muted:#a7b5aa;
  --subtle:#748178;
  --line:#2b3d31;
  --line-strong:#405a48;
  --green:#58f58b;
  --green-2:#2fce69;
  --green-soft:rgba(88,245,139,.10);
  --green-soft-2:rgba(88,245,139,.18);
  --blue:#9fc9ff;
  --peach:#ffd4bb;
  --gold:#ffe3a3;
  --radius:14px;
  --shadow:0 16px 42px rgba(0,0,0,.26);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#020604;color:var(--text);font-family:var(--font);min-height:100%}
button{font:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.prototype-toolbar{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  min-height:56px;padding:8px 14px;background:rgba(2,6,4,.94);
  border-bottom:1px solid #162019;backdrop-filter:blur(14px)
}
.prototype-title{display:flex;align-items:center;gap:10px;min-width:0}
.prototype-title strong{font-size:13px;letter-spacing:.02em}
.prototype-title span{font:11px var(--mono);color:#8aa293}
.prototype-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.control-group{display:flex;padding:3px;border:1px solid #243028;border-radius:10px;background:#07100b}
.control-group button{
  border:0;background:transparent;color:#9cad9f;padding:7px 10px;border-radius:7px;
  font-size:12px;cursor:pointer
}
.control-group button.active{background:#16331f;color:var(--green)}
#stage{display:flex;justify-content:center;padding:22px;min-height:calc(100vh - 56px)}
.device-frame{
  position:relative;overflow:hidden;background:var(--bg);border:1px solid #26352b;
  box-shadow:0 24px 70px rgba(0,0,0,.48);transition:width .22s ease,height .22s ease,border-radius .22s ease;
}
.device-frame.desktop{width:min(1360px,calc(100vw - 44px));height:860px;border-radius:18px}
.device-frame.tablet{width:min(980px,calc(100vw - 44px));height:860px;border-radius:20px}
.device-frame.mobile{width:min(390px,calc(100vw - 24px));height:844px;border-radius:28px}
.share-shell{height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.share-header{
  position:relative;z-index:80;flex:0 0 auto;background:rgba(7,17,11,.95);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line)
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 18px 10px}
.brand-area{min-width:0}
.brand-kicker{display:flex;align-items:center;gap:7px;color:var(--green);font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.16em}
.trip-title{margin:7px 0 0;font-size:20px;line-height:1.1;letter-spacing:-.02em}
.trip-meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn,.text-btn{
  height:40px;border:1px solid var(--line-strong);background:#0d1b12;color:var(--text);
  border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer
}
.icon-btn{width:40px;padding:0}
.text-btn{padding:0 12px;font-size:12px}
.header-tabs{display:flex;gap:4px;padding:0 18px 10px;overflow:auto;scrollbar-width:none}
.header-tabs::-webkit-scrollbar{display:none}
.view-tab{
  min-width:112px;height:40px;padding:0 14px;border:1px solid transparent;background:#0a150e;color:#b8c6bb;
  border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font:600 12px var(--mono);letter-spacing:.03em
}
.view-tab.active{
  color:var(--green);background:linear-gradient(180deg,rgba(88,245,139,.16),rgba(88,245,139,.08));
  border-color:rgba(88,245,139,.26);box-shadow:inset 3px 0 0 var(--green)
}
.workspace{min-height:0;flex:1;display:grid;background:#08110c}
.device-frame.desktop .workspace{grid-template-columns:minmax(520px,64fr) 4px minmax(340px,36fr)}
.device-frame.tablet .workspace{grid-template-columns:minmax(480px,56fr) 4px minmax(340px,44fr)}
.device-frame.mobile .workspace{grid-template-columns:1fr}
.content-pane{min-width:0;min-height:0;overflow:auto;background:#09130d;scrollbar-color:#33463a transparent}
.splitter{background:#25352b;cursor:col-resize}
.map-pane{position:relative;min-width:0;min-height:0;border-left:1px solid var(--line);background:#08130e;overflow:hidden}
.device-frame.mobile .splitter,.device-frame.mobile .map-pane{display:none}
.map-toolbar{
  position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;justify-content:space-between;gap:8px;pointer-events:none
}
.map-chip{
  pointer-events:auto;display:flex;align-items:center;gap:7px;min-height:34px;padding:0 10px;border:1px solid #385145;
  background:rgba(8,20,14,.90);border-radius:10px;font-size:11px;color:#d6e4da;box-shadow:0 8px 24px rgba(0,0,0,.25)
}
.map-canvas{position:absolute;inset:0;background:
  radial-gradient(circle at 28% 18%,rgba(88,245,139,.05),transparent 28%),
  linear-gradient(25deg,transparent 46%,rgba(108,142,120,.10) 47% 49%,transparent 50%),
  linear-gradient(-18deg,transparent 46%,rgba(108,142,120,.08) 47% 49%,transparent 50%),
  #0a1710}
.map-canvas:before,.map-canvas:after{
  content:"";position:absolute;inset:-10%;background:
  repeating-linear-gradient(90deg,transparent 0 54px,rgba(255,255,255,.025) 55px 56px),
  repeating-linear-gradient(0deg,transparent 0 54px,rgba(255,255,255,.025) 55px 56px);
  transform:rotate(8deg)
}
.route-svg{position:absolute;inset:8% 4% 7% 4%;width:92%;height:85%;z-index:2}
.map-label{
  position:absolute;z-index:3;padding:5px 8px;border:1px solid #42604d;border-radius:8px;background:#0d1c13;
  font-size:10px;color:#dfe9e1;box-shadow:0 5px 14px rgba(0,0,0,.3)
}
.map-label.tokyo{left:64%;top:48%}.map-label.hakone{left:18%;top:30%}.map-label.kawaguchi{left:12%;top:18%}
.map-stat{
  position:absolute;left:14px;bottom:14px;right:14px;z-index:4;
  padding:12px;border:1px solid #31463a;border-radius:12px;background:rgba(8,19,13,.90);box-shadow:var(--shadow)
}
.map-stat strong{display:block;font-size:12px}.map-stat span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.scroll-body{padding:14px 16px 40px}
.section-label{font:700 10px var(--mono);color:var(--green);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.trip-strip{
  display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:7px;margin-bottom:14px
}
.trip-strip-item{
  border:1px solid var(--line);background:#0b1710;border-radius:11px;padding:9px 10px;min-width:0
}
.trip-strip-item .d{font:700 10px var(--mono);color:var(--green)}
.trip-strip-item .city{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-stack{display:flex;flex-direction:column;gap:12px}
.day-bento{
  display:grid;grid-template-columns:78px minmax(0,1fr);border:1px solid var(--line);background:#09140d;border-radius:15px;overflow:hidden
}
.day-identity{
  position:relative;padding:14px 10px;border-right:1px solid var(--line);background:#0a160f
}
.day-number{
  width:44px;height:44px;border:1px solid #45614f;border-radius:999px;display:flex;align-items:center;justify-content:center;
  color:#c6d3c9;font:700 11px var(--mono);background:#0e1c13
}
.day-number.active{color:#051007;border-color:var(--green);background:var(--green);box-shadow:0 0 0 4px rgba(88,245,139,.08),0 0 26px rgba(88,245,139,.18)}
.day-date{margin-top:12px;font-size:15px;font-weight:700;line-height:1}
.day-stop-count{margin-top:6px;font:10px var(--mono);color:var(--muted)}
.day-main{padding:12px;min-width:0}
.day-main-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.locality{min-width:0;color:#c2d0c5;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-summary{flex:none;color:var(--green);font:10px var(--mono)}
.bento-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px}
.tile{
  min-width:0;border:1px solid #31453a;background:#0f1d14;border-radius:11px;padding:10px;overflow:hidden;
  display:flex;gap:9px;align-items:flex-start
}
.tile:hover{border-color:#466451;background:#112117}
.tile.transport{grid-column:span 7}.tile.photo{grid-column:span 5;display:block}.tile.hotel{grid-column:span 5}
.tile.activity{grid-column:span 7}.tile.meal{grid-column:span 5}.tile.rental{grid-column:span 7}
.tile.icon-only{grid-column:span 4}
.tile-icon{
  width:24px;height:24px;flex:none;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#102319;color:var(--green)
}
.tile.transport .tile-icon{color:var(--blue)}.tile.meal .tile-icon{color:var(--peach)}.tile.rental .tile-icon{color:var(--gold)}
.tile-copy{min-width:0}
.tile-title{font-size:12px;line-height:1.35;color:#f0f5f1}
.tile-meta{font:10px var(--mono);color:var(--muted);margin-top:5px;line-height:1.35}
.tile-actions{display:flex;gap:8px;margin-top:6px;font:10px var(--mono);color:#9db6a5}
.tile-actions span{display:inline-flex;align-items:center;gap:4px}
.tile-photo{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:8px;border:1px solid #405647;margin-top:8px;display:block}
.tile.photo .tile-title{display:flex;align-items:center;gap:8px}
.photo-badge{margin-left:auto;font:9px var(--mono);color:#9eaba2}
.compact-list{display:flex;flex-direction:column;gap:7px}
.compact-line{
  display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:7px;align-items:start;padding:6px 4px;border-radius:8px
}
.compact-line:hover{background:#122019}
.compact-line .ci{color:var(--green);margin-top:1px}.compact-line .ct{font-size:12px;line-height:1.35}
.compact-line .cm{font:9px var(--mono);color:var(--muted);padding-top:2px}
.timeline-wrap{position:relative}
.timeline-wrap:before{
  content:"";position:absolute;left:38px;top:16px;bottom:16px;width:1px;background:linear-gradient(var(--green),#365044 35%,#365044 85%,transparent)
}
.timeline-day{
  position:relative;display:grid;grid-template-columns:78px minmax(0,1fr);gap:0;margin-bottom:14px
}
.timeline-id{padding:2px 8px 0 0;position:relative;z-index:2}
.timeline-id .day-number{margin:auto;width:44px;height:44px}
.timeline-content{min-width:0;padding:0 0 0 2px}
.timeline-heading{padding:3px 4px 9px}.timeline-heading strong{font-size:15px}.timeline-heading span{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.journey-card{border:1px solid var(--line);border-radius:13px;background:#0d1a12;padding:9px 10px}
.journey-row{
  position:relative;display:grid;grid-template-columns:31px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 3px
}
.journey-row + .journey-row{border-top:1px solid #213027}
.seq{
  width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:#11271a;color:var(--green);font:700 9px var(--mono)
}
.seq.transport{color:var(--blue)}.seq.hotel{color:#07110b;background:var(--green)}.seq.meal{color:var(--peach)}
.journey-title{font-size:12px;line-height:1.35}.journey-meta{font:9px var(--mono);color:var(--muted);margin-top:4px}
.journey-time{font:9px var(--mono);color:#d4e1d6;padding-top:3px}
.journey-photo{width:100%;max-width:260px;margin-top:8px;border:1px solid #405647;border-radius:8px}
.matrix-shell{min-width:max-content;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0b1710}
.matrix-head,.matrix-row{display:flex;min-height:42px}
.matrix-head{position:sticky;top:0;z-index:15;background:#102017;border-bottom:1px solid #3a5143}
.matrix-row{min-height:94px;border-bottom:1px solid #26372d}
.matrix-row:last-child{border-bottom:0}
.cell{
  flex:none;border-right:1px solid #26372d;padding:8px;font-size:11px;line-height:1.35;background:#0b1710
}
.cell:last-child{border-right:0}.matrix-head .cell{font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:#b8c8bb;background:#102017}
.cell.date{width:98px;position:sticky;left:0;z-index:12;background:#0d1b12;box-shadow:1px 0 #34483b}
.cell.day{width:56px;position:sticky;left:98px;z-index:11;background:#0d1b12;box-shadow:1px 0 #34483b}
.matrix-head .cell.date,.matrix-head .cell.day{z-index:20;background:#13251a}
.cell.city{width:146px}.cell.activities{width:220px}.cell.transport{width:180px}.cell.hotel{width:180px}.cell.rental{width:175px}.cell.meals{width:175px}.cell.notes{width:210px}
.mini-item{padding:6px;border-radius:8px;background:#101f16;border:1px solid #24362b;margin-bottom:5px}
.mini-item:last-child{margin-bottom:0}.mini-item strong{display:block;font-size:11px;font-weight:600}.mini-item small{display:block;margin-top:4px;color:var(--muted);font:9px var(--mono)}
.table-wrap{overflow:auto;max-width:100%;padding:14px 16px 38px}
.mobile-map-fab{
  display:none;position:absolute;z-index:90;right:14px;bottom:14px;height:44px;padding:0 14px;border-radius:999px;border:1px solid #86ffad;
  background:var(--green);color:#06100a;font-weight:700;box-shadow:0 0 28px rgba(88,245,139,.26);align-items:center;gap:8px;cursor:pointer
}
.map-sheet{display:none}
.device-frame.mobile .mobile-map-fab{display:flex}
.device-frame.mobile .header-actions .map-header-btn{display:none}
.device-frame.mobile .header-row{padding:11px 12px 8px}
.device-frame.mobile .brand-kicker{font-size:9px}
.device-frame.mobile .trip-title{font-size:18px;margin-top:5px}
.device-frame.mobile .trip-meta{font-size:11px;margin-top:5px}
.device-frame.mobile .header-actions{gap:6px}
.device-frame.mobile .icon-btn{width:36px;height:36px;border-radius:9px}
.device-frame.mobile .header-tabs{padding:0 12px 9px;gap:5px}
.device-frame.mobile .view-tab{height:37px;min-width:0;flex:1;padding:0 8px;font-size:10px}
.device-frame.mobile .scroll-body{padding:11px 10px 86px}
.device-frame.mobile .trip-strip{grid-template-columns:repeat(5,118px);overflow:auto;margin:0 -10px 10px;padding:0 10px 4px;scrollbar-width:none}
.device-frame.mobile .trip-strip::-webkit-scrollbar{display:none}
.device-frame.mobile .day-stack{gap:10px}
.device-frame.mobile .day-bento{grid-template-columns:52px minmax(0,1fr);border-radius:13px}
.device-frame.mobile .day-identity{padding:10px 6px}
.device-frame.mobile .day-number{width:36px;height:36px;font-size:9px}
.device-frame.mobile .day-date{font-size:11px;margin-top:8px;text-align:center}
.device-frame.mobile .day-stop-count{font-size:8px;text-align:center}
.device-frame.mobile .day-main{padding:9px}
.device-frame.mobile .day-main-header{margin-bottom:8px}
.device-frame.mobile .locality{font-size:10px}.device-frame.mobile .route-summary{font-size:8px}
.device-frame.mobile .bento-grid{gap:5px}
.device-frame.mobile .tile{padding:8px;border-radius:9px;gap:7px}
.device-frame.mobile .tile.transport,.device-frame.mobile .tile.photo,.device-frame.mobile .tile.hotel,.device-frame.mobile .tile.activity,.device-frame.mobile .tile.meal,.device-frame.mobile .tile.rental,.device-frame.mobile .tile.icon-only{grid-column:span 12}
.device-frame.mobile .tile-icon{width:21px;height:21px}
.device-frame.mobile .tile-title{font-size:11px}.device-frame.mobile .tile-meta{font-size:8.5px}
.device-frame.mobile .tile-photo{aspect-ratio:16/7;margin-top:6px}
.device-frame.mobile .section-label{font-size:9px}
.device-frame.mobile .timeline-wrap:before{left:26px}
.device-frame.mobile .timeline-day{grid-template-columns:54px minmax(0,1fr);margin-bottom:10px}
.device-frame.mobile .timeline-id{padding-right:3px}.device-frame.mobile .timeline-id .day-number{width:36px;height:36px}
.device-frame.mobile .timeline-heading{padding-left:3px}.device-frame.mobile .timeline-heading strong{font-size:13px}.device-frame.mobile .timeline-heading span{font-size:9px}
.device-frame.mobile .journey-card{padding:6px 7px;border-radius:11px}
.device-frame.mobile .journey-row{grid-template-columns:27px minmax(0,1fr) auto;gap:6px;padding:7px 1px}
.device-frame.mobile .seq{width:22px;height:22px;font-size:8px}.device-frame.mobile .journey-title{font-size:10.5px}.device-frame.mobile .journey-meta,.device-frame.mobile .journey-time{font-size:8px}
.device-frame.mobile .journey-photo{max-width:190px}
.device-frame.mobile .table-wrap{padding:10px 0 74px}
.device-frame.mobile .matrix-shell{border-radius:0;border-left:0;border-right:0}
.device-frame.mobile .cell.date{width:96px}
.device-frame.mobile .cell.day{display:none}
.device-frame.mobile .cell.city{width:140px}.device-frame.mobile .cell.activities{width:205px}.device-frame.mobile .cell.transport{width:175px}.device-frame.mobile .cell.hotel{width:170px}.device-frame.mobile .cell.rental{width:170px}.device-frame.mobile .cell.meals{width:165px}.device-frame.mobile .cell.notes{width:190px}
.device-frame.mobile .map-sheet.open{display:block;position:absolute;inset:0;z-index:150;background:#07110b}
.map-sheet-header{height:54px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.map-sheet-header strong{font-size:14px}.map-sheet-body{position:absolute;top:54px;left:0;right:0;bottom:0}
.device-frame.tablet .header-row{padding-left:14px;padding-right:14px}
.device-frame.tablet .header-tabs{padding-left:14px;padding-right:14px}
.device-frame.tablet .scroll-body,.device-frame.tablet .table-wrap{padding-left:12px;padding-right:12px}
.device-frame.tablet .day-bento{grid-template-columns:66px minmax(0,1fr)}
.device-frame.tablet .tile.transport{grid-column:span 12}.device-frame.tablet .tile.photo{grid-column:span 6}.device-frame.tablet .tile.hotel{grid-column:span 6}.device-frame.tablet .tile.activity{grid-column:span 7}.device-frame.tablet .tile.meal{grid-column:span 5}.device-frame.tablet .tile.rental{grid-column:span 7}

/* V2: place photos belong to place-backed itinerary items, not to a standalone "photo" item. */
.place-photo-wrap{position:relative;margin-top:8px}
.place-photo-wrap .tile-photo{margin-top:0}
.place-photo-badge{
  position:absolute;right:6px;bottom:6px;display:inline-flex;align-items:center;gap:4px;
  min-height:22px;padding:0 7px;border:1px solid rgba(255,255,255,.14);border-radius:7px;
  background:rgba(3,10,6,.82);color:#d7e4da;font:8.5px var(--mono);backdrop-filter:blur(8px)
}
.tile.has-place-photo .tile-copy{width:100%}

/* V2 timeline: day = section; time/manual order = nodes. Deliberately different from Overview. */
.timeline-scroll{padding:14px 16px 112px}
.timeline-intro{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:12px}
.timeline-intro .section-label{margin:0}
.timeline-intro-copy{max-width:430px;text-align:right;color:var(--muted);font-size:10px;line-height:1.45}
.timeline-sections{display:flex;flex-direction:column;gap:14px}
.timeline-section{
  border:1px solid var(--line);border-radius:15px;background:#09140d;overflow:hidden
}
.timeline-section-header{
  min-height:58px;padding:10px 12px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;
  gap:10px;align-items:center;background:#0c1a12;border-bottom:1px solid var(--line)
}
.timeline-day-chip{
  width:38px;height:38px;border:1px solid #3d5747;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:#c5d4c8;background:#101e15;font:700 10px var(--mono)
}
.timeline-day-chip.active{border-color:var(--green);color:#06100a;background:var(--green);box-shadow:0 0 22px rgba(88,245,139,.18)}
.timeline-day-copy{min-width:0}
.timeline-day-copy strong{display:block;font-size:14px}
.timeline-day-copy span{display:block;margin-top:4px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline-day-count{font:9px var(--mono);color:var(--green)}
.timeline-node-list{position:relative;padding:7px 12px 10px}
.timeline-node-list:before{
  content:"";position:absolute;left:83px;top:13px;bottom:17px;width:1px;background:linear-gradient(var(--green),#365044 40%,#2a4034)
}
.timeline-node{

.media-thumb-v4 img{display:block;width:100%;height:100%;min-height:76px;max-height:130px;object-fit:cover}
.media-grid-v4.timeline .media-thumb-v4 img{max-height:110px}
.media-more-v4{position:absolute;right:5px;bottom:5px;padding:3px 5px;border-radius:5px;background:rgba(3,9,6,.82);font:7px var(--mono)}
.media-pdf-v4{min-height:76px;padding:9px;background:#101d16;display:flex;flex-direction:column;justify-content:center;gap:5px;color:#d7e3da;font-size:9px}
.pdf-icon-v4{width:max-content;padding:3px 5px;border:1px solid #526359;border-radius:5px;color:#cbd7ce;font:700 7px var(--mono)}

/* V4 — Timeline is default. One border per day restores visual grouping; inner nodes stay quiet. */
.timeline-v4{padding:14px 16px 120px}
.timeline-intro-v4{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}
.timeline-intro-copy-v4{color:var(--muted);font-size:9.5px;margin-top:-3px}
.timeline-sections-v4{display:flex;flex-direction:column;gap:11px}
.timeline-section-v4{border:1px solid #2d4135;border-radius:15px;background:#09140d;overflow:hidden}
.timeline-section-header-v4{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 11px 9px;border-bottom:1px solid rgba(43,61,49,.68);background:#0b1710}
.timeline-day-index-v4{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#102017;color:#c3d1c6;font:700 9px var(--mono)}
.timeline-day-index-v4.active{color:var(--green);box-shadow:inset 0 0 0 1px rgba(88,245,139,.3)}
.timeline-day-copy-v4{min-width:0}
.timeline-day-copy-v4 strong{display:block;font-size:15px;line-height:1.1}
.timeline-day-copy-v4 span{display:block;margin-top:4px;color:var(--muted);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline-day-count-v4{color:#7f9184;font:7.5px var(--mono);text-transform:uppercase}
.timeline-transport-list-v4{grid-column:2 / 4;display:flex;flex-direction:column;gap:3px;margin-top:-1px}
.timeline-transport-inline-v4{display:grid;grid-template-columns:18px minmax(0,auto) minmax(0,1fr);gap:5px;align-items:center;color:#b9c9d8;min-width:0}
.timeline-transport-icon-v4{display:flex;color:var(--blue)}
.timeline-transport-icon-v4 svg{width:12px;height:12px}
.timeline-transport-title-v4{min-width:0;font-size:9.4px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline-transport-meta-v4{min-width:0;color:#7f95a8;font:7.4px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline-node-list-v4{position:relative;padding:6px 11px 8px}
.timeline-node-list-v4:before{content:"";position:absolute;left:78px;top:22px;bottom:22px;width:1px;background:#355043}
.timeline-node-v4{position:relative;display:grid;grid-template-columns:52px 30px minmax(0,1fr);min-height:54px}
.timeline-node-key-v4{padding:11px 7px 0 0;text-align:right;color:#9aac9f;font:9px var(--mono)}
.timeline-node-key-v4.is-time{color:#d8e3da;font-size:9.5px}
.timeline-node-axis-v4{position:relative;z-index:2;padding-top:7px;display:flex;justify-content:center}
.timeline-node-dot-v4{width:27px;height:27px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#112319;color:var(--green);box-shadow:0 0 0 4px #09140d}
.timeline-node-v4.meal .timeline-node-dot-v4{color:var(--peach)}
.timeline-node-v4.rental .timeline-node-dot-v4{color:var(--gold)}
.timeline-node-v4.hotel .timeline-node-dot-v4{background:var(--green);color:#07110b}
.timeline-node-content-v4{min-width:0;margin:2px 0 4px;padding:6px 7px;border-radius:8px;background:transparent}
.timeline-node-v4:hover .timeline-node-content-v4{background:#0d1a12}
.timeline-node-topline-v4{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.timeline-node-title-v4{font-size:12px;line-height:1.38}
.timeline-node-type-v4{flex:none;color:#6e7d73;font:7px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.timeline-node-meta-v4{margin-top:3px;color:var(--muted);font:8px var(--mono);line-height:1.35}
.timeline-node-link-v4{display:inline-flex;align-items:center;gap:4px;margin-top:4px;color:#94aa9a;font:8px var(--mono);background:transparent;border:0;padding:0}
.timeline-node-content-v4 .media-grid-v4{max-width:290px;margin-top:6px}

.device-frame.tablet .overview-item-card-v4.span-featured{grid-column:span 7}
.device-frame.tablet .overview-item-card-v4.span-activity{grid-column:span 7}
.device-frame.tablet .overview-item-card-v4.span-compact{grid-column:span 5}
.device-frame.tablet .timeline-transport-inline-v4{grid-template-columns:16px minmax(0,1fr)}
.device-frame.tablet .timeline-transport-meta-v4{grid-column:2;display:block;margin-top:-2px}

.device-frame.mobile .overview-v4{padding:10px 10px 142px}
.device-frame.mobile .overview-subtitle-v4{display:none}
.device-frame.mobile .overview-days-v4{gap:14px}
.device-frame.mobile .overview-day-v4 + .overview-day-v4{padding-top:13px}
.device-frame.mobile .overview-day-heading-v4{margin-bottom:7px}
.device-frame.mobile .overview-day-title-v4 strong{font-size:13px}
.device-frame.mobile .overview-day-title-v4 span{font-size:8.5px}
.device-frame.mobile .overview-day-items-v4{font-size:6.8px}
.device-frame.mobile .overview-board-v4{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.device-frame.mobile .overview-item-card-v4.span-wide,.device-frame.mobile .overview-item-card-v4.span-featured,.device-frame.mobile .overview-item-card-v4.span-activity{grid-column:span 2}
.device-frame.mobile .overview-item-card-v4.span-compact{grid-column:span 1}
.device-frame.mobile .overview-item-card-v4{border-radius:10px;padding:8px}
.device-frame.mobile .overview-item-card-v4.span-wide{padding:7px 8px}
.device-frame.mobile .overview-item-top-v4{grid-template-columns:22px minmax(0,1fr) auto;gap:6px}
.device-frame.mobile .overview-item-icon-v4{width:20px;height:20px;border-radius:6px}
.device-frame.mobile .overview-item-title-v4{font-size:10px}
.device-frame.mobile .overview-item-card-v4.span-wide .overview-item-title-v4{font-size:9.5px}
.device-frame.mobile .overview-item-meta-v4{font-size:7px}
.device-frame.mobile .overview-order-v4{font-size:6.8px}
.device-frame.mobile .overview-item-footer-v4{font-size:6.5px;gap:5px;padding-top:5px}
.device-frame.mobile .media-thumb-v4 img{min-height:68px;max-height:100px}

.device-frame.mobile .timeline-v4{padding:10px 10px 142px}
.device-frame.mobile .timeline-intro-copy-v4{display:none}
.device-frame.mobile .timeline-sections-v4{gap:9px}
.device-frame.mobile .timeline-section-v4{border-radius:13px}
.device-frame.mobile .timeline-section-header-v4{grid-template-columns:38px minmax(0,1fr) auto;gap:8px;padding:8px 8px 7px}
.device-frame.mobile .timeline-day-index-v4{width:33px;height:33px;border-radius:10px;font-size:8px}
.device-frame.mobile .timeline-day-copy-v4 strong{font-size:13px}
.device-frame.mobile .timeline-day-copy-v4 span{font-size:8px}
.device-frame.mobile .timeline-day-count-v4{font-size:6.5px}
.device-frame.mobile .timeline-transport-list-v4{grid-column:2 / 4;gap:2px}
.device-frame.mobile .timeline-transport-inline-v4{grid-template-columns:15px minmax(0,1fr);gap:4px}
.device-frame.mobile .timeline-transport-title-v4{font-size:8px}
.device-frame.mobile .timeline-transport-meta-v4{grid-column:2;font-size:6.4px;margin-top:-2px}
.device-frame.mobile .timeline-node-list-v4{padding:5px 7px 7px}
.device-frame.mobile .timeline-node-list-v4:before{left:63px;top:20px;bottom:20px}
.device-frame.mobile .timeline-node-v4{grid-template-columns:42px 26px minmax(0,1fr);min-height:48px}
.device-frame.mobile .timeline-node-key-v4{padding:10px 5px 0 0;font-size:7.5px}
.device-frame.mobile .timeline-node-key-v4.is-time{font-size:8px}
.device-frame.mobile .timeline-node-dot-v4{width:23px;height:23px;border-radius:8px;box-shadow:0 0 0 4px #09140d}
.device-frame.mobile .timeline-node-dot-v4 svg{width:13px;height:13px}
.device-frame.mobile .timeline-node-content-v4{padding:5px 6px}
.device-frame.mobile .timeline-node-title-v4{font-size:10.5px}
.device-frame.mobile .timeline-node-type-v4{font-size:6.3px}
.device-frame.mobile .timeline-node-meta-v4,.device-frame.mobile .timeline-node-link-v4{font-size:7px}
.device-frame.mobile .timeline-node-content-v4 .media-grid-v4{max-width:220px}

</style>
</head>

  photo:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 19"/></svg>',
  hotel:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18v-7h18v7M5 11V7h6v4M13 11V6h6v5M3 21v-3h18v3"/></svg>',
  activity:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 9l8 3 8-3-8-6Z"/><path d="m7 11-2 7h14l-2-7M9 18v3m6-3v3"/></svg>',
  meal:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M16 3v18M16 3c3 2 4 5 4 8h-4"/></svg>',
  rental:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 17h14l-1-6-3-3H9l-3 3-1 6Z"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/><path d="M7 12h10"/></svg>',
  link:'<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14 21 3M15 3h6v6"/><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/></svg>',
  close:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg>'
};
function icon(name){return ICONS[name]||ICONS.activity}
function typeLabel(t){return ({transport:"Transport",hotel:"Hotel",activity:"Activity",meal:"Meal",rental:"Car rental"})[t]||t}
function itemOrder(day,item){
  return String(day.items.indexOf(item)+1).padStart(2,"0");
}
function mediaForItem(item){
  const media=[];
  (item.placePhotos||[]).forEach((src,index)=>media.push({kind:"image",src,source:"google_place",label:`Place photo ${index+1}`}));
  (item.attachments||[]).forEach((asset,index)=>media.push({
    kind:asset.kind||"file",
    src:asset.src||asset.url||"",
    source:"attachment",
    label:asset.label||asset.name||`Attachment ${index+1}`
  }));
  return media;
}
function mediaPreview(item,mode="overview"){
  const media=mediaForItem(item);
  if(!media.length)return "";
  const shown=media.slice(0,3);
  return `<div class="media-grid-v4 count-${Math.min(media.length,3)} ${mode}">
    ${shown.map((asset,index)=>asset.kind==="image"
      ?`<div class="media-thumb-v4"><img src="${asset.src}" alt="${asset.source==="google_place"?`Place photo for ${item.title}`:asset.label}">${index===2&&media.length>3?`<span class="media-more-v4">+${media.length-3}</span>`:""}</div>`
      :`<div class="media-pdf-v4"><span class="pdf-icon-v4">PDF</span><span>${asset.label}</span>${index===2&&media.length>3?`<b>+${media.length-3}</b>`:""}</div>`
    ).join("")}
  </div>`;
}
function overviewItemCard(day,item){
  const media=mediaForItem(item);
  const meta=[item.time,item.meta].filter(Boolean).join(" · ");
  const mediaClass=media.length?"has-media":"no-media";
  const spanClass=item.type==="transport"?"span-wide":media.length?"span-featured":item.type==="activity"?"span-activity":"span-compact";
  return `<article class="overview-item-card-v4 ${item.type} ${mediaClass} ${spanClass}">
    <div class="overview-item-top-v4">
      <span class="overview-item-icon-v4">${icon(item.type)}</span>
      <div class="overview-item-copy-v4">
        <div class="overview-item-title-v4">${item.title}</div>
        ${meta?`<div class="overview-item-meta-v4">${meta}</div>`:""}
      </div>
      ${item.type!=="transport"?`<span class="overview-order-v4">${itemOrder(day,item)}</span>`:""}
    </div>
    ${mediaPreview(item,"overview")}
    <div class="overview-item-footer-v4">
      <span>${typeLabel(item.type)}</span>
      ${media.length?`<span>${media.length} media</span>`:""}
      ${item.link?`<span class="overview-link-v4">${icon("link")} ${item.link}</span>`:""}
    </div>
  </article>`;
}
function overview(){
 return `<div class="overview-v4">
   <div class="overview-title-row-v4"><div><div class="section-label">Whole trip overview</div><div class="overview-subtitle-v4">Media-aware board. Attachment/place media gets visual weight; category does not require a separate layout system.</div></div></div>
   <div class="overview-days-v4">${DAYS.map((d)=>`<section class="overview-day-v4">
      <header class="overview-day-heading-v4">
        <div class="overview-day-title-v4"><strong>D${d.n} · ${d.date}</strong><span>${d.stops} ${d.stops===1?"stop":"stops"} · ${d.city}</span></div>
        <span class="overview-day-items-v4">${d.items.length} items</span>
      </header>
      <div class="overview-board-v4">${d.items.map(item=>overviewItemCard(d,item)).join("")}</div>
    </section>`).join("")}</div>
 </div>`;
}
function timelineTransportInline(item){
  const meta=[item.time,item.meta].filter(Boolean).join(" · ");
  return `<div class="timeline-transport-inline-v4">
    <span class="timeline-transport-icon-v4">${icon("transport")}</span>
    <span class="timeline-transport-title-v4">${item.title}</span>
    ${meta?`<span class="timeline-transport-meta-v4">${meta}</span>`:""}
  </div>`;
}
function timeline(){
 return `<div class="timeline-scroll timeline-v4">
  <div class="timeline-intro-v4">
    <div><div class="section-label">Journey timeline</div><div class="timeline-intro-copy-v4">Default share view · each day is one quiet section; exact time or manual order labels the nodes.</div></div>
  </div>
  <div class="timeline-sections-v4">
   ${DAYS.map((d,di)=>{
      const transport=d.items.filter(item=>item.type==="transport");
      const nodes=d.items.filter(item=>item.type!=="transport");
      return `<section class="timeline-section-v4">
        <header class="timeline-section-header-v4">
          <div class="timeline-day-index-v4 ${di===0?"active":""}">D${d.n}</div>
          <div class="timeline-day-copy-v4"><strong>${d.date}</strong><span>${d.stops} ${d.stops===1?"stop":"stops"} · ${d.city}</span></div>
          <div class="timeline-day-count-v4">${nodes.length} stops</div>
          ${transport.length?`<div class="timeline-transport-list-v4">${transport.map(timelineTransportInline).join("")}</div>`:""}
        </header>
        <div class="timeline-node-list-v4">
          ${nodes.map(item=>{
            const order=itemOrder(d,item);
            const key=item.time||order;
            const exact=Boolean(item.time);
            return `<div class="timeline-node-v4 ${item.type}">
              <div class="timeline-node-key-v4 ${exact?"is-time":"is-order"}">${key}</div>
              <div class="timeline-node-axis-v4"><span class="timeline-node-dot-v4">${icon(item.type)}</span></div>
              <div class="timeline-node-content-v4">
                <div class="timeline-node-topline-v4"><div class="timeline-node-title-v4">${item.title}</div><div class="timeline-node-type-v4">${typeLabel(item.type)}</div></div>
                ${item.meta?`<div class="timeline-node-meta-v4">${item.meta}</div>`:""}
                ${mediaPreview(item,"timeline")}
                ${item.link?`<div class="timeline-node-link-v4">${icon("link")} ${item.link}</div>`:""}
              </div>
            </div>`;
          }).join("")}
        </div>
      </section>`;
   }).join("")}
  </div>
 </div>`;
}
function colItems(d,type){
  const types=Array.isArray(type)?type:[type];
  return d.items.filter(i=>types.includes(i.type));
}
function minis(items){
  if(!items.length)return "—";
  return items.map(i=>`<div class="mini-item"><strong>${i.title}</strong>${(i.meta||i.time||i.link)?`<small>${[i.time,i.meta,i.link].filter(Boolean).join(" · ")}</small>`:""}</div>`).join("");
}
function table(){
 return `<div class="table-wrap">
  <div class="section-label">Read-only itinerary matrix · structure preserved</div>
  <div class="matrix-shell" role="grid">
   <div class="matrix-head">
    <div class="cell date">Day / Date</div><div class="cell day">Day</div><div class="cell city">City / town</div>
    <div class="cell activities">Activities</div><div class="cell transport">Transport</div><div class="cell hotel">Hotel</div>
    <div class="cell rental">Car rental</div><div class="cell meals">Meals</div><div class="cell notes">Notes</div>
   </div>
   ${DAYS.map(d=>`<div class="matrix-row">
    <div class="cell date"><strong>Day ${d.n}</strong><br>${d.date}</div>
    <div class="cell day"><strong>${d.n}</strong></div>
    <div class="cell city">${d.city}</div>
    <div class="cell activities">${minis(colItems(d,"activity"))}</div>
    <div class="cell transport">${minis(colItems(d,"transport"))}</div>
    <div class="cell hotel">${minis(colItems(d,"hotel"))}</div>
    <div class="cell rental">${minis(colItems(d,"rental"))}</div>
    <div class="cell meals">${minis(colItems(d,"meal"))}</div>
    <div class="cell notes">—</div>
   </div>`).join("")}
  </div>
 </div>`;
}
function mapMarkup(sheet=false){
 return `<div class="${sheet?"map-sheet-body":"map-canvas"}">
  <div class="map-canvas">
   <svg class="route-svg" viewBox="0 0 500 650" preserveAspectRatio="none" aria-hidden="true">
     <path d="M105 130 C165 180 108 255 168 290 S300 345 350 430 S370 530 400 580" fill="none" stroke="rgba(88,245,139,.15)" stroke-width="12" stroke-linecap="round"/>
     <path d="M105 130 C165 180 108 255 168 290 S300 345 350 430 S370 530 400 580" fill="none" stroke="#58f58b" stroke-width="3" stroke-linecap="round"/>
     <circle cx="105" cy="130" r="11" fill="#58f58b"/><circle cx="168" cy="290" r="10" fill="#0c1b12" stroke="#58f58b" stroke-width="3"/>
     <circle cx="350" cy="430" r="10" fill="#0c1b12" stroke="#58f58b" stroke-width="3"/><circle cx="400" cy="580" r="10" fill="#0c1b12" stroke="#58f58b" stroke-width="3"/>
   </svg>
   <div class="map-label kawaguchi">河口湖</div><div class="map-label hakone">箱根町</div><div class="map-label tokyo">Tokyo</div>
   <div class="map-stat"><strong>Map & routes</strong><span>Uses existing saved-route / stop-order data. This prototype keeps map geometry illustrative rather than inventing new trip data.</span></div>
  </div>
 </div>`;
}
function shell(view,device){
 return `<main class="share-shell">
  <header class="share-header">
   <div class="header-row">
    <div class="brand-area">
      <div class="brand-kicker">${icon("route")} Trip Planner</div>
      <h1 class="trip-title">Summer in Japan</h1>
      <div class="trip-meta">Jul 17 – Jul 22, 2026 · 6 days</div>
    </div>
    <div class="header-actions">
      <button class="text-btn map-header-btn" data-map-open>${icon("map")}<span class="desktop-only">Map & routes</span></button>
      <button class="icon-btn" aria-label="Share">${icon("share")}</button>
    </div>
   </div>
  </header>
  <div class="workspace">
   <section class="content-pane">${view==="overview"?overview():view==="timeline"?timeline():table()}</section>
   <div class="splitter"></div>
   <aside class="map-pane">
    <div class="map-toolbar"><div class="map-chip">${icon("map")} Map & routes</div><div class="map-chip">Shared route</div></div>
    ${mapMarkup(false)}
   </aside>
  </div>
  <nav class="view-dock" aria-label="Itinerary views">
    ${["overview","table","timeline"].map(v=>`<button class="view-dock-tab ${view===v?"active":""}" data-inner-view="${v}">${icon(v)}<span>${v[0].toUpperCase()+v.slice(1)}</span></button>`).join("")}
  </nav>
  <button class="mobile-map-fab" data-map-open>${icon("map")} Map & routes</button>
  <section class="map-sheet" id="mapSheet">
    <div class="map-sheet-header"><strong>Map & routes</strong><button class="icon-btn" data-map-close aria-label="Close map">${icon("close")}</button></div>
    ${mapMarkup(true)}
  </section>
 </main>`;
}

const params=new URLSearchParams(location.search);
let state={
  device:["desktop","tablet","mobile"].includes(params.get("device"))?params.get("device"):"desktop",
  view:["overview","table","timeline"].includes(params.get("view"))?params.get("view"):"timeline"
};
const frame=document.getElementById("frame");
function render(){
  frame.className=`device-frame ${state.device}`;
  frame.innerHTML=shell(state.view,state.device);
  document.querySelectorAll("[data-device]").forEach(b=>b.classList.toggle("active",b.dataset.device===state.device));
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));
  frame.querySelectorAll("[data-inner-view]").forEach(b=>b.addEventListener("click",()=>{state.view=b.dataset.innerView;render()}));
  frame.querySelectorAll("[data-map-open]").forEach(b=>b.addEventListener("click",()=>{
    if(state.device==="mobile") frame.querySelector("#mapSheet").classList.add("open");
  }));
  frame.querySelector("[data-map-close]")?.addEventListener("click",()=>frame.querySelector("#mapSheet").classList.remove("open"));
}
document.querySelectorAll("[data-device]").forEach(b=>b.addEventListener("click",()=>{state.device=b.dataset.device;render()}));
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{state.view=b.dataset.view;render()}));
render();
</script>
</body>
</html>

name: CloudBase PG schema security

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_mode:
        description: Select canonical CI or the protected Phase 5/6 matrix
        required: true
        default: schema-security
        type: choice
        options:
          - schema-security
          - phase5
          - phase6
      verification_gate:
        description: Type VERIFY only when run_mode is phase5 or phase6
        required: false
        type: string
      candidate_ref:
        description: Branch, tag, or SHA to check out (must resolve to candidate_sha and source event SHA)
        required: false
        type: string
      candidate_sha:
        description: Exact 40-character commit SHA to verify
        required: false
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: cloudbase-pg-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  static:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.run_mode != 'phase5' && inputs.run_mode != 'phase6')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_REGION: global
      AUTH_PROVIDER: supabase
      DATA_PROVIDER: supabase
      NEXT_PUBLIC_MAPS_PROVIDER: google
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
      NEXT_PUBLIC_TELEMETRY_ENVIRONMENT: development
      STORAGE_PROVIDER: supabase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24
      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm ci
      - run: npm run check:cloudbase-pg-baseline
      - run: npm run check:database-pg-migrations
      - run: npm run check:cloudbase-pg-rpc-surface
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:telemetry
      - run: npm run check:backend-provider-boundary
      - run: npm run check:maps-provider-boundary
      - run: npm run check:i18n
      - run: npm run validate:public-templates
      - run: npm run format:check

  global-build:
    if: >-
      (github.event_name != 'workflow_dispatch' ||
      (inputs.run_mode != 'phase5' && inputs.run_mode != 'phase6')) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login != github.repository_owner)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_REGION: global
      AUTH_PROVIDER: supabase
      DATA_PROVIDER: supabase
      NEXT_PUBLIC_APP_REGION: global
      NEXT_PUBLIC_MAPS_PROVIDER: google
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
      NEXT_PUBLIC_TELEMETRY_ENVIRONMENT: development
      STORAGE_PROVIDER: supabase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24
      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm ci
      - run: npm run build
      - run: npm run check:build-secret-boundary
      - run: npm run check:build-provider-isolation

  cn-build:
    if: >-
      (github.event_name != 'workflow_dispatch' ||
      (inputs.run_mode != 'phase5' && inputs.run_mode != 'phase6')) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login != github.repository_owner)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_REGION: cn
      AUTH_PROVIDER: cloudbase
      CLOUDBASE_ENV_ID: trip-planner-cn-dev-d3bz94038b26
      CLOUDBASE_PUBLISHABLE_KEY: ci-placeholder
      CLOUDBASE_REGION: ap-shanghai
      CN_PUBLIC_PHONE_AUTH_ENABLED: "true"
      DATA_PROVIDER: cloudbase
      NEXT_PUBLIC_APP_REGION: cn
      NEXT_PUBLIC_CLOUDBASE_ENV_ID: trip-planner-cn-dev-d3bz94038b26
      NEXT_PUBLIC_CLOUDBASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_CLOUDBASE_REGION: ap-shanghai
      NEXT_PUBLIC_MAPS_PROVIDER: amap
      NEXT_PUBLIC_SITE_URL: https://cn-preview.example.invalid
      NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
      NEXT_PUBLIC_TELEMETRY_ENVIRONMENT: development
      STORAGE_PROVIDER: cloudbase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24
      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm ci
      - run: npm run build
      - run: npm run check:build-secret-boundary
      - run: npm run check:build-provider-isolation

  pr-live-verification:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    needs: static
    uses: ./.github/workflows/phase-5-dual-environment.yml
    with:
      candidate_ref: ${{ github.event.pull_request.head.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      source_sha: ${{ github.event.pull_request.head.sha }}
      run_static: false
      verification_gate: VERIFY
    secrets: inherit

  verification-gate:
    if: >-
      ${{ always() &&
      (github.event_name != 'workflow_dispatch' ||
      (inputs.run_mode != 'phase5' && inputs.run_mode != 'phase6')) }}
    needs: [static, global-build, cn-build, pr-live-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CN_BUILD_RESULT: ${{ needs.cn-build.result }}
      GLOBAL_BUILD_RESULT: ${{ needs.global-build.result }}
      TRUSTED_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner }}
      LIVE_RESULT: ${{ needs.pr-live-verification.result }}
      STATIC_RESULT: ${{ needs.static.result }}
    steps:
      - name: Require the correct exact-SHA verification matrix
        run: |
          test "$STATIC_RESULT" = "success"
          if [ "$TRUSTED_PULL_REQUEST" = "true" ]; then
            test "$LIVE_RESULT" = "success"
            test "$GLOBAL_BUILD_RESULT" = "skipped"
            test "$CN_BUILD_RESULT" = "skipped"
          else
            test "$LIVE_RESULT" = "skipped"
            test "$GLOBAL_BUILD_RESULT" = "success"
            test "$CN_BUILD_RESULT" = "success"
          fi

  live-cloudbase-dev:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'schema-security'
    needs: [global-build, cn-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudbase-pg-dev
    env:
      APP_REGION: cn
      AUTH_PROVIDER: cloudbase
      CLOUDBASE_ENV_ID: trip-planner-cn-dev-d3bz94038b26
      CLOUDBASE_REGION: ap-shanghai
      CN_PUBLIC_PHONE_AUTH_ENABLED: "true"
      CLOUDBASE_PG_INSTANCE_ID: pgdb-l4lhtrv7
      CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
      DATA_PROVIDER: cloudbase
      NEXT_PUBLIC_APP_REGION: cn
      NEXT_PUBLIC_CLOUDBASE_ENV_ID: trip-planner-cn-dev-d3bz94038b26
      NEXT_PUBLIC_CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLOUDBASE_REGION: ap-shanghai
      NEXT_PUBLIC_MAPS_PROVIDER: amap
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
      NEXT_PUBLIC_TELEMETRY_ENVIRONMENT: development
      PHASE3_APP_BASE_URL: http://127.0.0.1:3100
      STORAGE_PROVIDER: cloudbase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24
      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm ci
      - name: Validate the approved disposable target
        run: >-
          npm run check:cloudbase-pg-target --
          --env-id trip-planner-cn-dev-d3bz94038b26
          --region ap-shanghai
          --instance-id pgdb-l4lhtrv7
      - name: Build the real CN application without Supabase configuration
        run: |
          npm run build
          npm run check:build-provider-isolation
      - name: Run raw RLS/RPC and real CN application paths
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_TEST_USER_A_PASSWORD: ${{ secrets.CLOUDBASE_TEST_USER_A_PASSWORD }}
          CLOUDBASE_TEST_USER_B_PASSWORD: ${{ secrets.CLOUDBASE_TEST_USER_B_PASSWORD }}
          PHASE3_START_APP: "1"
        run: npm run test:cloudbase-phase-3-live
      - name: Require controlled Global Supabase dev credentials
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
        run: >-
          test -n "$NEXT_PUBLIC_SUPABASE_URL" &&
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - name: Build the real Global application for reverse cookie isolation
        env:
          APP_REGION: global
          AUTH_PROVIDER: supabase
          DATA_PROVIDER: supabase
          NEXT_PUBLIC_MAPS_PROVIDER: google
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          STORAGE_PROVIDER: supabase
        run: |
          node -e 'require("node:fs").rmSync(".next", { force: true, recursive: true })'
          npm run build
          npm run check:build-provider-isolation
      - name: Prove Global rejects CN cookies on its real protected route
        env:
          APP_REGION: global
          AUTH_PROVIDER: supabase
          DATA_PROVIDER: supabase
          NEXT_PUBLIC_MAPS_PROVIDER: google
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          PHASE3_GLOBAL_BASE_URL: http://127.0.0.1:3100
          STORAGE_PROVIDER: supabase
        run: npm run test:global-cookie-isolation
      - name: Require Phase 4 live credentials
        if: ${{ always() }}
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
          CLOUDBASE_TEST_USER_A_PASSWORD: ${{ secrets.CLOUDBASE_TEST_USER_A_PASSWORD }}
          CLOUDBASE_TEST_USER_B_PASSWORD: ${{ secrets.CLOUDBASE_TEST_USER_B_PASSWORD }}
          CRON_SECRET: ${{ secrets.SUPABASE_DEV_CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_DEV_SECRET_KEY }}
        run: |
          test -n "$CLOUDBASE_API_KEY"
          test -n "$CLOUDBASE_PUBLISHABLE_KEY"
          test -n "$CLOUDBASE_TEST_USER_A_PASSWORD"
          test -n "$CLOUDBASE_TEST_USER_B_PASSWORD"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$CRON_SECRET"
      - name: Authenticate the Phase 4 CloudBase audit CLI
        if: ${{ always() }}
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: >-
          npx --yes --package @cloudbase/cli@3.8.1 tcb login
          --cloudbase-api-key "$CLOUDBASE_API_KEY"
          --env-id "$CLOUDBASE_ENV_ID"
          --json
      - name: Run CloudBase Phase 4 Storage A/B live suite
        if: ${{ always() }}
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
          CLOUDBASE_TEST_USER_A_PASSWORD: ${{ secrets.CLOUDBASE_TEST_USER_A_PASSWORD }}
          CLOUDBASE_TEST_USER_B_PASSWORD: ${{ secrets.CLOUDBASE_TEST_USER_B_PASSWORD }}
        run: npm run test:cloudbase-phase-4-storage
      - name: Independently invoke CloudBase Phase 4 cleanup
        if: ${{ always() }}
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
          CLOUDBASE_TEST_USER_A_PASSWORD: ${{ secrets.CLOUDBASE_TEST_USER_A_PASSWORD }}
          CLOUDBASE_TEST_USER_B_PASSWORD: ${{ secrets.CLOUDBASE_TEST_USER_B_PASSWORD }}
        run: npm run test:cloudbase-phase-4-cleanup
      - name: Run Supabase Phase 4 Storage and Cron live suite
        if: ${{ always() }}
        env:
          CRON_SECRET: ${{ secrets.SUPABASE_DEV_CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_DEV_SECRET_KEY }}
        run: npm run test:supabase-phase-4-storage

  phase6-verification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.run_mode == 'phase5' || inputs.run_mode == 'phase6') &&
      inputs.verification_gate == 'VERIFY'
    uses: ./.github/workflows/phase-5-dual-environment.yml
    with:
      candidate_ref: ${{ inputs.candidate_ref }}
      candidate_sha: ${{ inputs.candidate_sha }}
      source_sha: ${{ github.sha }}
      run_static: true
      verification_gate: ${{ inputs.verification_gate }}
    secrets: inherit

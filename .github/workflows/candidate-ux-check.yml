name: Candidate route and order checks

on:
  push:
    branches:
      - fix/share-day-route-state-and-notes

permissions:
  contents: read

jobs:
  targeted-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_REGION: global
      AUTH_PROVIDER: supabase
      DATA_PROVIDER: supabase
      NEXT_PUBLIC_MAPS_PROVIDER: google
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
      STORAGE_PROVIDER: supabase
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm ci
      - name: Reproduce route recalculation with co-located stops
        run: node --test src/lib/providers/google/google-routes.test.ts
      - name: Verify pending order and undo in the browser
        run: CHROME_PATH=/usr/bin/google-chrome node scripts/price-flight-route-ux-e2e.mjs
      - name: Return formatted changed files for review
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFile } from "node:fs/promises";
          import prettier from "prettier";
          const files = execFileSync("git", ["diff", "--name-only", "2163116d34a78b63dd279a5c74ed1630dd92c2e5", "HEAD"], {encoding: "utf8"}).trim().split("\n");
          for (const path of files.filter(path => /\.(?:tsx?|mjs|json)$/.test(path))) {
            const source = await readFile(path, "utf8");
            const content = await prettier.format(source, {...await prettier.resolveConfig(path), filepath: path});
            if (source !== content) console.log("CODEX_FORMAT_FILE " + JSON.stringify({path, content}));
          }
          NODE

name: Deploy CN

on:
  workflow_dispatch:
    inputs:
      deployment_gate:
        description: Type DEPLOY after the CloudBase deployment gate and user confirmation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-cn-${{ github.sha }}
  cancel-in-progress: false

jobs:
  deploy-cn:
    if: ${{ inputs.deployment_gate == 'DEPLOY' }}
    environment: cloudbase-cn-dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_REGION: cn
      AUTH_PROVIDER: cloudbase
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      CLOUDBASE_ENV_ID: trip-planner-cn-dev-d3bz94038b26
      CLOUDBASE_PG_INSTANCE_ID: pgdb-l4lhtrv7
      CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
      CLOUDBASE_REGION: ap-shanghai
      DATA_PROVIDER: cloudbase
      NEXT_PUBLIC_APP_REGION: cn
      NEXT_PUBLIC_CLOUDBASE_ENV_ID: trip-planner-cn-dev-d3bz94038b26
      NEXT_PUBLIC_CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLOUDBASE_REGION: ap-shanghai
      NEXT_PUBLIC_MAPS_PROVIDER: amap
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
      NEXT_PUBLIC_TELEMETRY_ENVIRONMENT: production
      STORAGE_PROVIDER: cloudbase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24
      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm ci
      - name: Validate the approved CN target
        run: >-
          npm run check:cloudbase-pg-target --
          --env-id trip-planner-cn-dev-d3bz94038b26
          --region ap-shanghai
          --instance-id pgdb-l4lhtrv7
      - name: Build the CN selector without cross-region credentials
        run: npm run build
      - run: npm run check:build-secret-boundary
      - run: npm run prepare:cloudbase-run
      - name: Authenticate the environment-scoped CloudBase CLI
        run: >-
          npx --yes --package @cloudbase/cli@3.8.1 tcb login
          --cloudbase-api-key "$CLOUDBASE_API_KEY"
          --env-id "$CLOUDBASE_ENV_ID"
          --json
      - name: Apply reviewed CloudBase PG migrations
        run: >-
          npx --yes --package @cloudbase/cli@3.8.1 tcb db pg migration up
          --env-id "$CLOUDBASE_ENV_ID"
          --json
      - name: Deploy the private cleanup Event Function and timer
        run: >-
          npx --yes --package @cloudbase/cli@3.8.1 tcb fn deploy trip-planner-cleanup
          --env-id "$CLOUDBASE_ENV_ID"
          --runtime Nodejs18.15
          --install-dependency true
          --force
          --json
      - name: Require an initialized healthy CloudBase Run service
        run: |
          detail_output="$(mktemp)"
          trap 'rm -f "$detail_output"' EXIT
          npx --yes --package @cloudbase/cli@3.8.1 tcb cloudrun detail \
            --env-id "$CLOUDBASE_ENV_ID" \
            --service-name trip-planner-cn \
            --json > "$detail_output"
          node scripts/verify-cloudbase-run-detail.mjs \
            "$detail_output" trip-planner-cn
      - name: Deploy the same SHA to CloudBase Run
        run: >-
          npx --yes --package @cloudbase/cli@3.8.1 tcb cloudrun deploy
          --env-id "$CLOUDBASE_ENV_ID"
          --service-name trip-planner-cn
          --source .cloudbase-run
          --port 8080
          --install-dependency false
          --force
          --wait
          --json
      - name: Verify the CloudBase Run service after deployment
        run: |
          detail_output="$(mktemp)"
          trap 'rm -f "$detail_output"' EXIT
          npx --yes --package @cloudbase/cli@3.8.1 tcb cloudrun detail \
            --env-id "$CLOUDBASE_ENV_ID" \
            --service-name trip-planner-cn \
            --json > "$detail_output"
          node scripts/verify-cloudbase-run-detail.mjs \
            "$detail_output" trip-planner-cn

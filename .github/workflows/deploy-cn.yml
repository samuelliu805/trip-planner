name: Deploy CN

on:
  workflow_dispatch:
    inputs:
      deployment_gate:
        description: Type DEPLOY after the CloudBase deployment gate and user confirmation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-cn-${{ github.sha }}
  cancel-in-progress: false

jobs:
  deploy-cn:
    if: ${{ inputs.deployment_gate == 'DEPLOY' }}
    environment: cloudbase-cn-dev
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AMAP_JS_SECURITY_CODE: ${{ secrets.AMAP_JS_SECURITY_CODE }}
      AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
      APP_REGION: cn
      AUTH_PROVIDER: cloudbase
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      CLOUDBASE_ENV_ID: trip-planner-cn-dev-d3bz94038b26
      CLOUDBASE_PG_INSTANCE_ID: pgdb-l4lhtrv7
      CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
      CLOUDBASE_REGION: ap-shanghai
      DATA_PROVIDER: cloudbase
      NEXT_PUBLIC_APP_REGION: cn
      NEXT_PUBLIC_AMAP_JS_API_KEY: ${{ secrets.NEXT_PUBLIC_AMAP_JS_API_KEY }}
      NEXT_PUBLIC_CLOUDBASE_ENV_ID: trip-planner-cn-dev-d3bz94038b26
      NEXT_PUBLIC_CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLOUDBASE_REGION: ap-shanghai
      NEXT_PUBLIC_MAPS_PROVIDER: amap
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
      NEXT_PUBLIC_TELEMETRY_ENVIRONMENT: production
      STORAGE_PROVIDER: cloudbase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24
      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm ci
      - name: Validate the approved CN target
        run: >-
          npm run check:cloudbase-pg-target --
          --env-id trip-planner-cn-dev-d3bz94038b26
          --region ap-shanghai
          --instance-id pgdb-l4lhtrv7
      - name: Validate the CN provider environment
        run: npm run check:phase-5-environment -- cn
      - name: Build the CN selector without cross-region credentials
        run: npm run build
      - run: npm run check:build-secret-boundary
      - run: npm run prepare:cloudbase-run
      - name: Enforce the CloudBase Run source package size limit
        run: |
          package_directory="$(mktemp -d)"
          package_archive="$package_directory/cloudbase-run.zip"
          cleanup_package_archive() {
            rm -f "$package_archive"
            rmdir "$package_directory"
          }
          trap cleanup_package_archive EXIT
          if ! zip -1 -q -r "$package_archive" .cloudbase-run > /dev/null 2>&1; then
            echo "CloudBase Run source package compression failed." >&2
            exit 1
          fi
          if ! package_bytes="$(stat -c %s "$package_archive" 2> /dev/null)"; then
            echo "CloudBase Run source package measurement failed." >&2
            exit 1
          fi
          printf 'CloudBase Run source package size: %s bytes.\n' "$package_bytes"
          if (( package_bytes > 25 * 1024 * 1024 )); then
            echo "CloudBase Run source package exceeds 25 MiB." >&2
            exit 1
          fi
      - name: Authenticate the environment-scoped CloudBase CLI
        run: >-
          npx --yes --package @cloudbase/cli@3.8.1 tcb login
          --cloudbase-api-key "$CLOUDBASE_API_KEY"
          --env-id "$CLOUDBASE_ENV_ID"
          --json
      - name: Apply reviewed CloudBase PG migrations
        run: >-
          npx --yes --package @cloudbase/cli@3.8.1 tcb db pg migration up
          --env-id "$CLOUDBASE_ENV_ID"
          --json
      - name: Deploy the private cleanup Event Function and timer
        run: >-
          npx --yes --package @cloudbase/cli@3.8.1 tcb fn deploy trip-planner-cleanup
          --env-id "$CLOUDBASE_ENV_ID"
          --runtime Nodejs18.15
          --install-dependency true
          --force
          --json
      - name: Require an initialized healthy CloudBase Run service
        run: |
          detail_output="$(mktemp)"
          trap 'rm -f "$detail_output"' EXIT
          npx --yes --package @cloudbase/cli@3.8.1 tcb cloudrun detail \
            --env-id "$CLOUDBASE_ENV_ID" \
            --service-name trip-planner-cn \
            --json > "$detail_output"
          node scripts/verify-cloudbase-run-detail.mjs \
            "$detail_output" trip-planner-cn
      - name: Deploy the same SHA and require CloudBase Run release evidence
        run: |
          previous_records="$(mktemp)"
          retry_records="$(mktemp)"
          current_records="$(mktemp)"
          detail_output="$(mktemp)"
          trap 'rm -f "$previous_records" "$retry_records" "$current_records" "$detail_output"' EXIT
          npx --yes --package @cloudbase/cli@3.8.1 tcb cloudrun record list \
            --env-id "$CLOUDBASE_ENV_ID" \
            --service-name trip-planner-cn \
            --json > "$previous_records"
          previous_deploy_id="$(node scripts/verify-cloudbase-run-records.mjs \
            "$previous_records" latest)"
          deploy_cloudbase_run() {
            npx --yes --package @cloudbase/cli@3.8.1 \
              tcb --yes cloudrun deploy \
              --env-id "$CLOUDBASE_ENV_ID" \
              --service-name trip-planner-cn \
              --source .cloudbase-run \
              --port 8080 \
              --install-dependency false \
              --force \
              --wait \
              --json
          }
          if deploy_cloudbase_run; then
            :
          else
            npx --yes --package @cloudbase/cli@3.8.1 tcb cloudrun record list \
              --env-id "$CLOUDBASE_ENV_ID" \
              --service-name trip-planner-cn \
              --json > "$retry_records"
            node scripts/verify-cloudbase-run-records.mjs \
              "$retry_records" unchanged "$previous_deploy_id"
            sleep 10
            deploy_cloudbase_run
          fi
          npx --yes --package @cloudbase/cli@3.8.1 tcb cloudrun record list \
            --env-id "$CLOUDBASE_ENV_ID" \
            --service-name trip-planner-cn \
            --json > "$current_records"
          node scripts/verify-cloudbase-run-records.mjs \
            "$current_records" released "$previous_deploy_id"
          npx --yes --package @cloudbase/cli@3.8.1 tcb cloudrun detail \
            --env-id "$CLOUDBASE_ENV_ID" \
            --service-name trip-planner-cn \
            --json > "$detail_output"
          node scripts/verify-cloudbase-run-detail.mjs \
            "$detail_output" trip-planner-cn --require-online-version
          node scripts/verify-cloudbase-run-health.mjs "$NEXT_PUBLIC_SITE_URL"

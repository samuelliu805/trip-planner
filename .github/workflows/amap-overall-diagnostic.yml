name: Reported AMap overall route diagnostic
on:
  push:
    branches: [fix/amap-real-overall-routes-table]
permissions:
  contents: read
concurrency:
  group: reported-amap-overall-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'samuelliu805/trip-planner' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: cloudbase-cn-dev
    timeout-minutes: 10
    env:
      CLOUDBASE_ENV_ID: trip-planner-cn-dev-d3bz94038b26
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Authenticate the approved CN diagnostic target
        run: >-
          npx --yes --package @cloudbase/cli@3.8.1 tcb login
          --cloudbase-api-key "$CLOUDBASE_API_KEY"
          --env-id "$CLOUDBASE_ENV_ID" --json
      - name: Install task public encryption key
        run: |
          cat > /tmp/amap-diagnostic-public.pem <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArofRdHr8o+vSxew1iXif
          y7nVw50HphuvYSejugqTGCs2YwdseHqSZM6xK0CgO79rXeq1s27Iyu0rPRvO02zv
          1PIYB9wgtgY1uzGjFe4fZ+qU4WUTP1x/ciwOxWvHEYwU+uzXMuf/JCG2k0gGkjYK
          IFgDLRCshlgBCfSEE570go3LKPAPSqlzVfNHGop3O1lU9/7P7+x8etYhjw/7LlBa
          fCkFJguvgPM5aknA2KcQJoiRXAmxzU4t0yG4O2FdDySu2mAsGKdGe+B2J4vA/h0t
          PXNxKVBbhZQ/pP+0b8loq08iEpeFrtK8IJUivpoHsqpZZRFjx6PlvbTeWjp69Qro
          5QIDAQAB
          -----END PUBLIC KEY-----
          PUBLIC_KEY
      - name: Use the existing bounded AMap edge selection for the overseas runner
        run: |
          restapi_address="$(node scripts/select-amap-ci-edge.mjs restapi.amap.com)"
          test -n "$restapi_address"
          printf '%s restapi.amap.com\n' "$restapi_address" | sudo --non-interactive tee -a /etc/hosts > /dev/null
      - name: Read the reported route and probe each actual AMap leg
        run: node scripts/amap-overall-diagnostic.mjs
